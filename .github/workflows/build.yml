name: Xcode - Build

on: 
  push:
  pull_request:
  workflow_dispatch:
    inputs: 
      release__nightly:
        description: Create a nightly release
        type: boolean
        required: false

jobs:
  build-sidestore:
    name: Build patched SideStore IPA
    runs-on: xcode-27
    steps:
      - name: Checkout LiveContainer patches
        uses: actions/checkout@v6
        with:
          path: lc-repo
          fetch-depth: 1

      - name: Checkout LiveContainer/SideStore
        uses: actions/checkout@v6
        with:
          repository: LiveContainer/SideStore
          ref: LiveContainerSupport
          submodules: recursive
          path: sidestore-src

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Install tools
        run: brew install ldid xcbeautify

      - name: Apply login and Anisette patches
        run: |
          set -euo pipefail
          git clone https://github.com/mahee96/AnisetteKit.git sidestore-src/Dependencies/AnisetteKit-patched
          git -C sidestore-src/Dependencies/AnisetteKit-patched checkout db8b41022697b6c19be8a5f01a1ce834145a2a26
          git -C sidestore-src/Dependencies/AnisetteKit-patched apply "$GITHUB_WORKSPACE/lc-repo/.github/sidelc-fix/anisettekit.patch"
          git -C sidestore-src/Dependencies/SideSign apply "$GITHUB_WORKSPACE/lc-repo/.github/sidelc-fix/sidesign.patch"
          git -C sidestore-src apply "$GITHUB_WORKSPACE/lc-repo/.github/sidelc-fix/sidestore.patch"
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('sidestore-src/Dependencies/SideSign/Package.swift')
          s = p.read_text()
          old = '.package(url: "https://github.com/mahee96/AnisetteKit.git",   branch: "main"),'
          assert old in s, 'AnisetteKit dependency line not found verbatim'
          s = s.replace(old, '.package(name: "AnisetteKit", path: "../AnisetteKit-patched"),')
          p.write_text(s)
          PYEOF

      - name: Build patched SideStore
        working-directory: sidestore-src
        run: |
          BUILD_NUM="${{ github.run_number }}"
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(python3 scripts/ci/workflow.py commit-id)
          NORMALIZED_VERSION=$(python3 scripts/ci/workflow.py compute-normalized "$MARKETING_VERSION" "$BUILD_NUM" "$SHORT_COMMIT")
          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED_VERSION"
          python3 scripts/ci/workflow.py build

      - name: Upload patched SideStore IPA
        uses: actions/upload-artifact@v7
        with:
          name: SideStore-patched.ipa
          path: sidestore-src/SideStore.ipa

  build:
    name: Build using xcodebuild command
    needs: [build-sidestore]
    runs-on: xcode-27
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: ${{ env.scheme }}.ipa
      artifact2: ${{ env.scheme }}+SideStore.ipa
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\.xcworkspace\$ || ls -A | grep -i \\.xcodeproj\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: Prepare Dependencies
        run: |
          sh .github/prepare_dependencies.sh
      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release | xcpretty && exit ${PIPESTATUS[0]}
      - name: Download patched SideStore IPA
        uses: actions/download-artifact@v8
        with:
          name: SideStore-patched.ipa
          path: tmp
      - name: Create IPA
        run: |
          sh .github/build_github.sh

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}.ipa
          path: ${{ env.scheme }}.ipa
      
      - name: Upload LiveContainer+SideStore
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}+SideStore.ipa
          path: ${{ env.scheme }}+SideStore.ipa
